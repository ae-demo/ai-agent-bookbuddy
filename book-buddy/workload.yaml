apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: book-buddy

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  endpoints:
    - component: ai-agent-bookbuddy-library-service
      name: http
      visibility: project
      envBindings:
        address: LIBRARY_SERVICE_URL
  resources:
    - ref: ai-agent-bookbudd-d5e05090
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
    - ref: ai-agent-bookbudd-51a94be8
      envBindings:
        dbname: MEMORY_DB_DBNAME
        host: MEMORY_DB_HOST
        password: MEMORY_DB_PASSWORD
        port: MEMORY_DB_PORT
        user: MEMORY_DB_USER
