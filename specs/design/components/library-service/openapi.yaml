openapi: 3.0.3
info:
  title: Library Service
  version: 0.1.0
  description: Read-only lookup over the team's static in-memory book catalogue.
servers:
  - url: /
paths:
  /books:
    get:
      operationId: searchBooks
      summary: Search the catalogue by genre and/or author
      parameters:
        - name: genre
          in: query
          schema: { type: string }
          description: Filter to books of this genre
        - name: author
          in: query
          schema: { type: string }
          description: Filter to books by this author
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
              example:
                count: 2
                next: null
                previous: null
                data:
                  - id: "b1"
                    title: "The Silent Patient"
                    author: "Alex Michaelides"
                    genre: "mystery"
                    year: 2019
                    available: true
                  - id: "b2"
                    title: "In the Woods"
                    author: "Tana French"
                    genre: "mystery"
                    year: 2007
                    available: false
        '400':
          description: Invalid filter parameter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /books/{id}:
    get:
      operationId: getBook
      summary: Get one book's details and availability
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
              example:
                id: "b1"
                title: "The Silent Patient"
                author: "Alex Michaelides"
                genre: "mystery"
                year: 2019
                available: true
        '404':
          description: No book with this id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Book:
      type: object
      required: [id, title, author, genre, year, available]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        genre: { type: string }
        year: { type: integer }
        available: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
